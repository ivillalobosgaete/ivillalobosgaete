# Las claves se leen de las variables del archivo .env (nunca escribirlas aquí).
api:
  listen: ":1984"
  username: ${RELAY_USER}
  password: ${RELAY_PASS}
rtsp:
  listen: ""          # no se reexpone RTSP
webrtc:
  listen: ""          # no se usa WebRTC
streams:
  # Dahua: puerto RTSP 554 (no el 37777 de la app). subtype=1 es la subtransmisión liviana.
  # Si el equipo es un grabador (NVR) con varias cámaras, cambiar channel=1 por el número de canal.
  cam1: rtsp://${CAM_USER}:${CAM_PASS_1}@10.1.1.65:554/cam/realmonitor?channel=1&subtype=1
  cam2: rtsp://${CAM_USER}:${CAM_PASS_2}@10.1.1.66:554/cam/realmonitor?channel=1&subtype=1
