# Equipo local de cámaras: go2rtc lee las cámaras de la red interna y cloudflared las publica
# por un túnel cifrado de salida (no se abren puertos en el router).
# Uso: copiar .env.ejemplo como .env, completar y ejecutar «docker compose up -d».
services:
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    # Solo para probar desde este mismo equipo (http://127.0.0.1:1984). No exponer a la red.
    ports:
      - "127.0.0.1:1984:1984"
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file: .env
    depends_on: [go2rtc]
